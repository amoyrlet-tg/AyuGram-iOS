name: CI

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ayugram-ios-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_DIR: /Users/Shared/telegram-ios
  BAZEL_CACHE: /Users/Shared/telegram-bazel-cache

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Telegram API before copying sources
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          python3 build-system/Make/Sideload.py \
            --template build-system/appstore-configuration.json \
            --output build-input/sideload-configuration.json
          python3 -m unittest discover -s Tests/AyuGram -p 'test_*.py'

      - name: Set active Xcode path
        run: |
          XCODE_VERSION=$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          xcodebuild -version
          swiftc -warnings-as-errors submodules/TelegramCore/Sources/AyuGram/AyuPrivacyPolicy.swift Tests/AyuGram/main.swift -o "$RUNNER_TEMP/ayu-privacy-tests"
          "$RUNNER_TEMP/ayu-privacy-tests"

      - name: Create canonical source directory
        run: |
          mkdir -p "$SOURCE_DIR"
          cp -R "$GITHUB_WORKSPACE/." "$SOURCE_DIR/"
          cmp build-input/sideload-configuration.json "$SOURCE_DIR/build-input/sideload-configuration.json"

      - name: Restore Bazel cache
        id: bazel-cache
        uses: actions/cache/restore@v6
        with:
          path: /Users/Shared/telegram-bazel-cache
          key: telegram-bazel-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('versions.json') }}-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: |
            telegram-bazel-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('versions.json') }}-
            telegram-bazel-${{ runner.os }}-${{ hashFiles('versions.json') }}-

      - name: Build the App for SideStore
        working-directory: /Users/Shared/telegram-ios
        run: |
          BUILD_NUMBER=$(( $(git rev-list --count HEAD) + $(cat build_number_offset) ))
          python3 -u build-system/Make/Make.py \
            --cacheDir="$BAZEL_CACHE" \
            --bazelUserRoot=/private/var/tmp/_bazel_containerhost \
            build \
            --configurationPath=build-input/sideload-configuration.json \
            --sideload \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"
          python3 build-system/Make/VerifySideload.py \
            --ipa bazel-bin/Telegram/Telegram.ipa \
            --configuration build-input/sideload-configuration.json \
            --variables build-input/configuration-repository/variables.bzl
          mkdir -p build/artifacts
          cp bazel-bin/Telegram/Telegram.ipa build/artifacts/AyuGram-SideStore.ipa
          shasum -a 256 build/artifacts/AyuGram-SideStore.ipa > build/artifacts/SHA256SUMS
          printf 'SideStore signs this IPA during installation with your Apple ID. iCloud, Siri, push entitlement and extensions are disabled.\n' > build/artifacts/INSTALL.txt

      - name: Save Bazel cache even if compilation fails
        if: ${{ always() && steps.bazel-cache.outcome == 'success' && steps.bazel-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: /Users/Shared/telegram-bazel-cache
          key: ${{ steps.bazel-cache.outputs.cache-primary-key }}

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: AyuGram-SideStore-${{ github.run_number }}
          path: /Users/Shared/telegram-ios/build/artifacts/
          if-no-files-found: error
          retention-days: 14
